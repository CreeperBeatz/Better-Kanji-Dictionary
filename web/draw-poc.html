<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Handwriting PoC — every recogniser at once</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; color: #222; }
    h1 { font-size: 18px; margin: 0 0 12px; }
    .top { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
    #pad { width: 320px; height: 320px; border: 1px solid #999; border-radius: 6px; touch-action: none; cursor: crosshair;
           background-image: linear-gradient(#eee 1px, transparent 1px), linear-gradient(90deg, #eee 1px, transparent 1px);
           background-size: 50% 50%; background-position: center; }
    .controls { display: flex; gap: 8px; margin-top: 8px; align-items: center; flex-wrap: wrap; }
    button { font-size: 14px; padding: 4px 12px; }
    #target { width: 3em; font-size: 20px; text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 16px; }
    .model { border: 1px solid #ddd; border-radius: 6px; padding: 8px 10px; }
    .model h2 { font-size: 14px; margin: 0; }
    .meta { font-size: 11px; color: #777; margin: 2px 0 6px; min-height: 1.3em; }
    .model ol { margin: 0; padding-left: 1.8em; }
    .model li { font-size: 13px; line-height: 1.6; }
    .model li .c { font-size: 22px; font-family: "Noto Sans JP", "Yu Gothic", sans-serif; margin-right: 6px; }
    .model li .s { color: #888; }
    .model li.hit { background: #d8f5d0; border-radius: 3px; }
    .rank { font-weight: 600; }
    .rank.miss { color: #b00; }
    #previews { display: flex; gap: 8px; margin-top: 8px; }
    #previews figure { margin: 0; font-size: 10px; color: #777; text-align: center; }
    #previews canvas { width: 96px; height: 96px; border: 1px solid #ddd; image-rendering: pixelated; }
    #log { font-size: 12px; color: #555; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Handwriting PoC — one canvas, every recogniser</h1>
  <div class="top">
    <div>
      <canvas id="pad" width="320" height="320"></canvas>
      <div class="controls">
        <button id="undo">Undo</button>
        <button id="clear">Clear</button>
        <label>I meant <input id="target" maxlength="2" /></label>
        <span id="strokes"></span>
      </div>
      <div id="previews"></div>
    </div>
    <div id="log"></div>
  </div>
  <div class="grid" id="grid"></div>

  <!-- A hidden canvas KanjiCanvas can own; it is fed our strokes, never drawn on. -->
  <canvas id="kc" width="256" height="256" style="display:none"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
  <script src="/models/kanji-canvas.js"></script>
  <script src="/models/kanjicanvas-refpatterns.js"></script>
  <script type="module" src="/src/poc/drawPoc.ts"></script>
</body>
</html>
